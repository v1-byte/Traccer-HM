name: Release

# Dipicu dengan mendorong tag versi, mis. `git tag v1.4.0 && git push origin v1.4.0`.
# Butuh 4 secret repo: HM_KEYSTORE_BASE64, HM_KEYSTORE_PASSWORD, HM_KEY_ALIAS, HM_KEY_PASSWORD (lihat docs/RELEASING.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Pastikan tag sama dengan versionName
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak cocok dengan versionName v$V di app/build.gradle.kts"
            exit 1
          fi

      - name: Pastikan secret penandatanganan tersedia
        env:
          KS_B64: ${{ secrets.HM_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HM_KEY_PASSWORD }}
        run: |
          for v in KS_B64 KS_PASS KS_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret untuk $v belum diisi. Rilis tanpa kunci rilis akan memakai kunci debug dan dibatalkan."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - run: gradle testDebugUnitTest --no-daemon

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.HM_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release bertanda tangan
        env:
          HM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          HM_KEY_PASSWORD: ${{ secrets.HM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon   # APK Adm Lock sengaja TIDAK ikut rilis publik

      - name: Kumpulkan artefak & checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/HMTracker-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${GITHUB_REF_NAME}.txt"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
