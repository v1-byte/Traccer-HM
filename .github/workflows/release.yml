name: Release

# Rilis otomatis saat tag versi didorong, mis. `git push origin v1.5.3`.
# Bisa juga dijalankan manual dengan tag yang sudah ada melalui Actions > Release > Run workflow.
# Secrets wajib: HM_KEYSTORE_BASE64, HM_KEYSTORE_PASSWORD, HM_KEY_ALIAS, HM_KEY_PASSWORD.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versi yang sudah ada, mis. v1.5.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Test, sign, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate version and tag
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$V" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG tidak cocok dengan versionName v$V di app/build.gradle.kts"
            exit 1
          fi
          echo "Rilis $RELEASE_TAG dengan versionName $V"

      - name: Validate signing secrets
        env:
          KS_B64: ${{ secrets.HM_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HM_KEY_PASSWORD }}
        run: |
          for v in KS_B64 KS_PASS KS_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diisi. Rilis dibatalkan agar APK debug tidak dipublikasikan."
              exit 1
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.HM_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass '${{ secrets.HM_KEYSTORE_PASSWORD }}' \
            -alias '${{ secrets.HM_KEY_ALIAS }}' >/dev/null

      - name: Build signed release APK
        env:
          HM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          HM_KEY_PASSWORD: ${{ secrets.HM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature and collect artifacts
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "dist/HMTracker-${RELEASE_TAG}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${RELEASE_TAG}.txt"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload release artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: HMTracker-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HM Tracker ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
